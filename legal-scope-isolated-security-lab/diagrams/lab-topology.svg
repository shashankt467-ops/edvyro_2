<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="100%" height="100%" style="background:#070c18; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="hostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="dockerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Marker Arrowheads -->
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.4" />
  </pattern>
  <rect width="1000" height="720" fill="url(#grid)" />

  <!-- HEADER TITLE -->
  <text x="500" y="38" text-anchor="middle" fill="#38bdf8" font-size="20" font-weight="700" letter-spacing="1.5">
    LAB TOPOLOGY ARCHITECTURE – ISOLATED CYBERSECURITY LAB
  </text>
  <text x="500" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">
    Single-Host Localhost Isolation Boundary with Docker Virtual Bridge &amp; Strict Loopback Binding
  </text>

  <!-- ==================== OUTER BOX: HOST MACHINE ==================== -->
  <rect x="40" y="80" width="620" height="490" rx="14" fill="url(#hostGrad)" stroke="#334155" stroke-width="2" />
  <rect x="40" y="80" width="620" height="34" rx="14" fill="#1e293b" />
  <rect x="40" y="100" width="620" height="14" fill="#1e293b" />
  <circle cx="62" cy="97" r="5" fill="#ef4444" />
  <circle cx="78" cy="97" r="5" fill="#f59e0b" />
  <circle cx="94" cy="97" r="5" fill="#10b981" />
  <text x="115" y="102" fill="#e2e8f0" font-size="13" font-weight="600">HOST MACHINE (Windows / Ubuntu Linux Workstation)</text>
  <text x="580" y="102" fill="#64748b" font-size="11" font-weight="500">Host IP: 192.168.x.x / DHCP</text>

  <!-- HOST WEB BROWSER NODE -->
  <g transform="translate(70, 130)">
    <rect width="250" height="75" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.8" filter="url(#emeraldGlow)" />
    <text x="15" y="25" fill="#10b981" font-size="13" font-weight="700">LOCAL WEB BROWSER / TESTER</text>
    <text x="15" y="45" fill="#f8fafc" font-size="12" font-family="'Consolas', 'Courier New', monospace">http://localhost:3000</text>
    <text x="15" y="62" fill="#94a3b8" font-size="10">Target URL: http://127.0.0.1:3000</text>
  </g>

  <!-- LOOPBACK INTERFACE (lo0) -->
  <g transform="translate(370, 130)">
    <rect width="255" height="75" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.8" filter="url(#cyanGlow)" />
    <text x="15" y="25" fill="#38bdf8" font-size="13" font-weight="700">LOOPBACK INTERFACE (lo)</text>
    <text x="15" y="45" fill="#f8fafc" font-size="12" font-family="'Consolas', 'Courier New', monospace">IP: 127.0.0.1 (RFC 1122)</text>
    <text x="15" y="62" fill="#bae6fd" font-size="10">Internal Kernel Ring-Fenced Socket</text>
  </g>

  <!-- Arrow Browser <-> Loopback -->
  <path d="M 320 167 L 364 167" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <path d="M 364 172 L 326 172" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)" />

  <!-- DOCKER PORT MAPPING CALLOUT -->
  <g transform="translate(230, 222)">
    <rect width="250" height="34" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" />
    <text x="125" y="21" text-anchor="middle" fill="#38bdf8" font-size="11" font-family="'Consolas', 'Courier New', monospace" font-weight="600">
      Port Forward: 127.0.0.1:3000
    </text>
  </g>

  <!-- Arrow Loopback to Docker -->
  <path d="M 495 205 L 495 270" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)" />

  <!-- ==================== DOCKER ENVIRONMENT BOUNDARY ==================== -->
  <rect x="70" y="275" width="560" height="270" rx="10" fill="url(#dockerGrad)" stroke="#0284c7" stroke-width="1.8" />
  <rect x="70" y="275" width="560" height="28" rx="10" fill="#0369a1" />
  <rect x="70" y="293" width="560" height="10" fill="#0369a1" />
  <text x="85" y="294" fill="#ffffff" font-size="12" font-weight="700">DOCKER ENVIRONMENT (Virtual Engine / daemon)</text>
  <text x="510" y="294" fill="#bae6fd" font-size="10">Driver: bridge</text>

  <!-- VIRTUAL BRIDGE NETWORK (docker0) -->
  <g transform="translate(95, 315)">
    <rect width="510" height="42" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3" />
    <text x="15" y="25" fill="#38bdf8" font-size="11" font-weight="600">DOCKER BRIDGE NETWORK (docker0): Subnet 172.17.0.0/16 | Gateway 172.17.0.1</text>
  </g>

  <!-- Arrow Bridge to Container -->
  <path d="M 350 357 L 350 380" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- ==================== OWASP JUICE SHOP CONTAINER ==================== -->
  <rect x="95" y="380" width="510" height="145" rx="8" fill="url(#appGrad)" stroke="#10b981" stroke-width="2" />
  <text x="115" y="405" fill="#a7f3d0" font-size="14" font-weight="700">TARGET: OWASP JUICE SHOP CONTAINER</text>
  <text x="510" y="405" fill="#6ee7b7" font-size="10" font-family="'Consolas', monospace">eth0: 172.17.0.2:3000</text>

  <!-- App Specs Inside Container -->
  <g transform="translate(115, 420)">
    <rect width="145" height="52" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="10" y="20" fill="#ecfdf5" font-size="11" font-weight="600">Web Engine</text>
    <text x="10" y="38" fill="#a7f3d0" font-size="10">Node.js + Express</text>
  </g>

  <g transform="translate(275, 420)">
    <rect width="145" height="52" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="10" y="20" fill="#ecfdf5" font-size="11" font-weight="600">Frontend UI</text>
    <text x="10" y="38" fill="#a7f3d0" font-size="10">Angular SPA (Port 3000)</text>
  </g>

  <g transform="translate(435, 420)">
    <rect width="145" height="52" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="10" y="20" fill="#ecfdf5" font-size="11" font-weight="600">Data Store</text>
    <text x="10" y="38" fill="#a7f3d0" font-size="10">SQLite (In-Memory/File)</text>
  </g>

  <text x="115" y="500" fill="#d1fae5" font-size="11" font-weight="500">
    STATUS: Local Vulnerable Web Application (Intentionally Unpatched for Training)
  </text>

  <!-- ==================== EXTERNAL NETWORK / WAN (RIGHT SIDE) ==================== -->
  <rect x="700" y="80" width="260" height="490" rx="14" fill="url(#blockGrad)" stroke="#dc2626" stroke-width="2" />
  <rect x="700" y="80" width="260" height="34" rx="14" fill="#991b1b" />
  <rect x="700" y="100" width="260" height="14" fill="#991b1b" />
  <text x="715" y="102" fill="#ffffff" font-size="12" font-weight="700">EXTERNAL NETWORK (LAN / WAN)</text>

  <g transform="translate(720, 140)">
    <rect width="220" height="60" rx="6" fill="#450a0a" stroke="#b91c1c" stroke-width="1.2" />
    <text x="15" y="24" fill="#fca5a5" font-size="11" font-weight="700">Public Internet / WAN</text>
    <text x="15" y="42" fill="#f87171" font-size="10">Automated Botnets &amp; Threat Actors</text>
  </g>

  <g transform="translate(720, 220)">
    <rect width="220" height="60" rx="6" fill="#450a0a" stroke="#b91c1c" stroke-width="1.2" />
    <text x="15" y="24" fill="#fca5a5" font-size="11" font-weight="700">Local Area Network (LAN)</text>
    <text x="15" y="42" fill="#f87171" font-size="10">Adjacent Wi-Fi &amp; Ethernet Devices</text>
  </g>

  <!-- BLOCKED ARROW & BARRIER -->
  <path d="M 720 340 L 670 340" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowRed)" />
  
  <g transform="translate(720, 310)">
    <rect width="220" height="130" rx="6" fill="#1e1b4b" stroke="#ef4444" stroke-width="1.8" />
    <text x="15" y="25" fill="#ef4444" font-size="12" font-weight="800">TRAFFIC DROPPED (REFUSED)</text>
    <text x="15" y="45" fill="#fecaca" font-size="10">No public inbound exposure:</text>
    <text x="15" y="65" fill="#fca5a5" font-size="10">• Inbound packets to port 3000</text>
    <text x="15" y="80" fill="#fca5a5" font-size="10">  from external IPs are dropped</text>
    <text x="15" y="95" fill="#fca5a5" font-size="10">• Loopback is inaccessible via NIC</text>
    <text x="15" y="112" fill="#fca5a5" font-size="10">• Router port forwarding forbidden</text>
  </g>

  <!-- Barrier Icon -->
  <circle cx="680" cy="340" r="14" fill="#ef4444" />
  <line x1="672" y1="332" x2="688" y2="348" stroke="#ffffff" stroke-width="3" />
  <line x1="688" y1="332" x2="672" y2="348" stroke="#ffffff" stroke-width="3" />

  <!-- ==================== WARNING BOTTOM PANEL ==================== -->
  <g transform="translate(40, 590)">
    <rect width="920" height="105" rx="8" fill="url(#warnGrad)" stroke="#f59e0b" stroke-width="2" />
    <text x="25" y="28" fill="#fbbf24" font-size="13" font-weight="700">
      CRITICAL SECURITY BOUNDARY WARNING: LOCALHOST BINDING != AIR-GAPPED ENVIRONMENT
    </text>
    <text x="25" y="50" fill="#fef3c7" font-size="11">
      • While -p 127.0.0.1:3000:3000 prevents remote LAN/Internet nodes from establishing inbound connections, the container shares the host OS kernel and hardware.
    </text>
    <text x="25" y="70" fill="#fef3c7" font-size="11">
      • Local host-side processes (browser extensions, local scripts, SSRF vulnerabilities, or host malware) CAN interact with 127.0.0.1:3000.
    </text>
    <text x="25" y="90" fill="#fef3c7" font-size="11">
      • Never execute unverified third-party exploits, and never bridge this container to public Wi-Fi or router DMZ.
    </text>
  </g>

  <!-- Draw.io compatibility metadata -->
  <desc>
    &lt;mxfile host=&quot;Electron&quot; modified=&quot;2026-11-12T14:30:00.000Z&quot; agent=&quot;Mozilla/5.0&quot; version=&quot;21.6.8&quot; type=&quot;device&quot;&gt;
      &lt;diagram id=&quot;lab-topology&quot; name=&quot;Lab Topology&quot;&gt;
        &lt;mxGraphModel dx=&quot;1000&quot; dy=&quot;720&quot; grid=&quot;1&quot; gridSize=&quot;10&quot; guides=&quot;1&quot; tooltips=&quot;1&quot; connect=&quot;1&quot; arrows=&quot;1&quot; fold=&quot;1&quot; page=&quot;1&quot; pageScale=&quot;1&quot; pageWidth=&quot;1000&quot; pageHeight=&quot;720&quot;&gt;
          &lt;root&gt;
            &lt;mxCell id=&quot;0&quot;/&gt;
            &lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;
            &lt;mxCell id=&quot;host&quot; value=&quot;Host Machine (127.0.0.1)&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#1e293b;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;
              &lt;mxGeometry x=&quot;40&quot; y=&quot;80&quot; width=&quot;620&quot; height=&quot;490&quot; as=&quot;geometry&quot;/&gt;
            &lt;/mxCell&gt;
            &lt;mxCell id=&quot;docker&quot; value=&quot;Docker Bridge (172.17.0.0/16)&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#0c4a6e;&quot; vertex=&quot;1&quot; parent=&quot;host&quot;&gt;
              &lt;mxGeometry x=&quot;30&quot; y=&quot;195&quot; width=&quot;560&quot; height=&quot;270&quot; as=&quot;geometry&quot;/&gt;
            &lt;/mxCell&gt;
            &lt;mxCell id=&quot;juiceshop&quot; value=&quot;OWASP Juice Shop (172.17.0.2:3000)&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#065f46;&quot; vertex=&quot;1&quot; parent=&quot;docker&quot;&gt;
              &lt;mxGeometry x=&quot;25&quot; y=&quot;105&quot; width=&quot;510&quot; height=&quot;145&quot; as=&quot;geometry&quot;/&gt;
            &lt;/mxCell&gt;
          &lt;/root&gt;
        &lt;/mxGraphModel&gt;
      &lt;/diagram&gt;
    &lt;/mxfile&gt;
  </desc>
</svg>

