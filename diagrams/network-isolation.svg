<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#070c18; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="safeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="hazardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <marker id="arrowGreen2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowRed2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="500" y="38" text-anchor="middle" fill="#38bdf8" font-size="20" font-weight="700" letter-spacing="1.5">
    NETWORK ISOLATION MECHANICS: LOCALHOST VS. WILDCARD BINDING
  </text>
  <text x="500" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">
    Comparison of Inbound Packet Routing &amp; Attack Surface Exposure on Host Operating System
  </text>

  <!-- ==================== LEFT PANEL: SAFE PRACTICE (127.0.0.1) ==================== -->
  <rect x="40" y="85" width="445" height="565" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" />
  <rect x="40" y="85" width="445" height="38" rx="12" fill="#064e3b" />
  <rect x="40" y="105" width="445" height="18" fill="#064e3b" />
  <circle cx="65" cy="104" r="6" fill="#10b981" />
  <text x="82" y="109" fill="#a7f3d0" font-size="14" font-weight="700">SECURE: LOCALHOST BINDING (127.0.0.1)</text>

  <!-- Command Badge -->
  <g transform="translate(60, 135)">
    <rect width="405" height="36" rx="6" fill="#022c22" stroke="#059669" stroke-width="1" />
    <text x="15" y="23" fill="#34d399" font-family="'Consolas', monospace" font-size="11">
      docker run -p 127.0.0.1:3000:3000 juice-shop
    </text>
  </g>

  <!-- Host Interface: lo0 -->
  <g transform="translate(60, 190)">
    <rect width="405" height="75" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="15" y="24" fill="#10b981" font-size="12" font-weight="700">Host Loopback Socket (127.0.0.1:3000)</text>
    <text x="15" y="44" fill="#e2e8f0" font-size="11">Source: Localhost Web Browser (Same Host Machine)</text>
    <text x="15" y="62" fill="#6ee7b7" font-size="11">Result: CONNECTION ACCEPTED (Direct Memory Loopback)</text>
  </g>

  <!-- External Interfaces -->
  <g transform="translate(60, 280)">
    <rect width="405" height="120" rx="8" fill="#1e1b4b" stroke="#334155" stroke-width="1.5" />
    <text x="15" y="24" fill="#94a3b8" font-size="12" font-weight="700">Host Physical NICs (Wi-Fi / Ethernet: 192.168.1.50)</text>
    <text x="15" y="44" fill="#fca5a5" font-size="11">Incoming SYN packet to port 3000 from LAN/Internet</text>
    <text x="15" y="66" fill="#ef4444" font-size="12" font-weight="700">TCP RST / SILENT DROP (PORT CLOSED)</text>
    <text x="15" y="86" fill="#cbd5e1" font-size="10">• OS Kernel checks listeners on 192.168.1.50:3000 -> NONE</text>
    <text x="15" y="103" fill="#cbd5e1" font-size="10">• Packet is instantly discarded before reaching Docker bridge</text>
  </g>

  <!-- Result Summary -->
  <g transform="translate(60, 420)">
    <rect width="405" height="135" rx="8" fill="url(#safeGrad)" stroke="#10b981" stroke-width="1.2" />
    <text x="15" y="26" fill="#a7f3d0" font-size="13" font-weight="700">Isolation Security Audit:</text>
    <text x="15" y="50" fill="#ecfdf5" font-size="11">✔ LAN devices cannot browse or exploit Juice Shop</text>
    <text x="15" y="72" fill="#ecfdf5" font-size="11">✔ Wi-Fi eavesdroppers cannot sniff HTTP credentials</text>
    <text x="15" y="94" fill="#ecfdf5" font-size="11">✔ Campus/corporate network firewalls see ZERO inbound traffic</text>
    <text x="15" y="116" fill="#ecfdf5" font-size="11">✔ Fully compliant with academic lab safety guidelines</text>
  </g>

  <g transform="translate(60, 570)">
    <rect width="405" height="60" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1" />
    <text x="15" y="24" fill="#34d399" font-size="11" font-weight="700">VERIFICATION COMMAND:</text>
    <text x="15" y="44" fill="#f8fafc" font-family="'Consolas', monospace" font-size="11">
      docker port juice-shop  ->  3000/tcp -> 127.0.0.1:3000
    </text>
  </g>

  <!-- ==================== RIGHT PANEL: HAZARDOUS WILDCARD (0.0.0.0) ==================== -->
  <rect x="515" y="85" width="445" height="565" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2" />
  <rect x="515" y="85" width="445" height="38" rx="12" fill="#7f1d1d" />
  <rect x="515" y="105" width="445" height="18" fill="#7f1d1d" />
  <circle cx="540" cy="104" r="6" fill="#ef4444" />
  <text x="557" y="109" fill="#fecaca" font-size="14" font-weight="700">DANGEROUS: WILDCARD BINDING (0.0.0.0)</text>

  <!-- Command Badge -->
  <g transform="translate(535, 135)">
    <rect width="405" height="36" rx="6" fill="#450a0a" stroke="#b91c1c" stroke-width="1" />
    <text x="15" y="23" fill="#f87171" font-family="'Consolas', monospace" font-size="11">
      docker run -p 3000:3000 juice-shop (INSECURE DEFAULT)
    </text>
  </g>

  <!-- Host Interface: 0.0.0.0 -->
  <g transform="translate(535, 190)">
    <rect width="405" height="75" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
    <text x="15" y="24" fill="#ef4444" font-size="12" font-weight="700">Wildcard Socket (0.0.0.0:3000)</text>
    <text x="15" y="44" fill="#e2e8f0" font-size="11">Binds to EVERY network interface on the operating system</text>
    <text x="15" y="62" fill="#fca5a5" font-size="11">Result: ALL INCOMING TRAFFIC ROUTED TO CONTAINER</text>
  </g>

  <!-- External Interfaces Exposure -->
  <g transform="translate(535, 280)">
    <rect width="405" height="120" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
    <text x="15" y="24" fill="#fca5a5" font-size="12" font-weight="700">Host Physical NICs &amp; Public Exposure</text>
    <text x="15" y="44" fill="#fef2f2" font-size="11">Incoming SYN packet from Wi-Fi neighbor / LAN device</text>
    <text x="15" y="66" fill="#f87171" font-size="12" font-weight="700">CONNECTION ACCEPTED &amp; FORWARDED</text>
    <text x="15" y="86" fill="#fecaca" font-size="10">• iptables / Windows NAT routes packet into 172.17.0.2:3000</text>
    <text x="15" y="103" fill="#fecaca" font-size="10">• Any malicious actor on the network can attack the vulnerable app</text>
  </g>

  <!-- Risk Summary -->
  <g transform="translate(535, 420)">
    <rect width="405" height="135" rx="8" fill="url(#hazardGrad)" stroke="#ef4444" stroke-width="1.2" />
    <text x="15" y="26" fill="#fecaca" font-size="13" font-weight="700">Hazard &amp; Threat Exposure Impact:</text>
    <text x="15" y="50" fill="#fee2e2" font-size="11">✖ Host system exposed to automated malware &amp; miners</text>
    <text x="15" y="72" fill="#fee2e2" font-size="11">✖ Potential unauthorized pivot into private home/work files</text>
    <text x="15" y="94" fill="#fee2e2" font-size="11">✖ Network IDS alerts trigger university/ISP abuse tickets</text>
    <text x="15" y="116" fill="#fee2e2" font-size="11">✖ Severe violation of academic security testing policies</text>
  </g>

  <g transform="translate(535, 570)">
    <rect width="405" height="60" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
    <text x="15" y="24" fill="#f87171" font-size="11" font-weight="700">HAZARD INDICATION TO REJECT:</text>
    <text x="15" y="44" fill="#fee2e2" font-family="'Consolas', monospace" font-size="11">
      docker port juice-shop  ->  3000/tcp -> 0.0.0.0:3000
    </text>
  </g>

  <!-- Draw.io compatibility metadata -->
  <desc>
    &lt;mxfile host=&quot;Electron&quot; modified=&quot;2026-11-12T14:30:00.000Z&quot; agent=&quot;Mozilla/5.0&quot; version=&quot;21.6.8&quot; type=&quot;device&quot;&gt;
      &lt;diagram id=&quot;network-isolation&quot; name=&quot;Network Isolation&quot;&gt;
        &lt;mxGraphModel dx=&quot;1000&quot; dy=&quot;680&quot; grid=&quot;1&quot; gridSize=&quot;10&quot;&gt;
          &lt;root&gt;
            &lt;mxCell id=&quot;0&quot;/&gt;
            &lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;
            &lt;mxCell id=&quot;safe&quot; value=&quot;Safe 127.0.0.1&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#064e3b;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;
              &lt;mxGeometry x=&quot;40&quot; y=&quot;85&quot; width=&quot;445&quot; height=&quot;565&quot; as=&quot;geometry&quot;/&gt;
            &lt;/mxCell&gt;
            &lt;mxCell id=&quot;danger&quot; value=&quot;Hazardous 0.0.0.0&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#7f1d1d;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;
              &lt;mxGeometry x=&quot;515&quot; y=&quot;85&quot; width=&quot;445&quot; height=&quot;565&quot; as=&quot;geometry&quot;/&gt;
            &lt;/mxCell&gt;
          &lt;/root&gt;
        &lt;/mxGraphModel&gt;
      &lt;/diagram&gt;
    &lt;/mxfile&gt;
  </desc>
</svg>

